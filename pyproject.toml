[project]
name = "mof-porosity"
version = "1.0.0"
description = "Machine-learning prediction of metal-organic framework porosity for the LMDS platform"
readme = "README.md"
# Pinned to 3.11: the ensemble pickles were saved with scikit-learn 1.2.0,
# whose tree format is unreadable by sklearn >= 1.3, and 1.2.x has no cp312
# wheels. 3.11 is the newest interpreter that runs the training-time stack.
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "boto3>=1.34.0",
    "structlog>=25.5.0",
    # Scientific stack pinned to the model's training-time versions so
    # predictions are bit-for-bit faithful to the published model. Do not bump
    # scikit-learn without re-saving the artifacts in src/model/artifacts.
    "scikit-learn==1.2.0",
    "numpy>=1.24,<2",
    "pandas>=1.5,<2.2",
    "joblib>=1.2",
    "rdkit>=2023.9",
    "mordredcommunity>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
model-run = "cmds.run:run_cli"
model-types = "cmds.model_types:main"
validate-model = "cmds.validate_model:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Model artifacts (scalers, descriptor table, ensemble models) live under
# src/model/artifacts and are swept into the wheel with the package, so the
# container can load them at runtime.
[tool.hatch.build.targets.wheel]
packages = ["src/cmds", "src/infrastructure", "src/model"]

[tool.uv]
package = true
